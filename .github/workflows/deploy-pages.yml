# Deploy Vite portals to Cloudflare Pages. Requires CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN.
# Apex: getlakbay.com → hris-landing. admin / onboarding subdomains unchanged.
# Token: least-privilege Pages Edit — see docs/PRODUCTION_CLOUDFLARE.md (do not use the Agent Token).
# Build bakes VITE_API_BASE_URL (not VITE_API_URL). Secret optional; defaults to https://api.getlakbay.com.

name: Deploy Pages

on:
  workflow_dispatch:
  push:
    tags:
      - "web-v*"

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build portals
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.getlakbay.com' }}
          VITE_OIDC_CLIENT_ID: 604evnknhtitgpltjdo90ghm7l
          VITE_OIDC_ISSUER: https://cognito-idp.ap-southeast-1.amazonaws.com/ap-southeast-1_Z0Q7ukIMG
          VITE_OIDC_AUTHORIZE_URL: https://hris-lab-mtgons5.auth.ap-southeast-1.amazoncognito.com/oauth2/authorize
          VITE_OIDC_TOKEN_URL: https://hris-lab-mtgons5.auth.ap-southeast-1.amazoncognito.com/oauth2/token
          VITE_OIDC_LOGOUT_URL: https://hris-lab-mtgons5.auth.ap-southeast-1.amazoncognito.com/logout
          VITE_LANDING_URL: https://getlakbay.com
          VITE_AUTH_DEV_BYPASS: "false"
        run: |
          npm run build -w @hris/web-admin
          npm run build -w @hris/web-onboarding
          npm run build -w @hris/web-landing
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web-admin/dist --project-name=hris-admin
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web-onboarding/dist --project-name=hris-onboarding
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web-landing/dist --project-name=hris-landing
