services:
  postgres:
    image: postgres:16-alpine
    container_name: hris-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris
      POSTGRES_DB: hris_lab
    ports:
      - "5432:5432"
    volumes:
      - hris_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d hris_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: hris-lab-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hris_pg_data:
