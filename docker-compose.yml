services:
  postgres:
    image: postgres:16-alpine
    container_name: hris-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris
      POSTGRES_DB: hris_lab
    ports:
      - "5432:5432"
    volumes:
      - hris_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d hris_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: hris-lab-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: hris-lab-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    volumes:
      - ./infra/keycloak/hris-realm.json:/opt/keycloak/data/import/hris-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hris_pg_data:
